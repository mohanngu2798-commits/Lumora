name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vannam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Play Store bundle. Signed when the repository has the VANNAM_* secrets, unsigned otherwise.
      - name: Unpack upload key
        env:
          KEYSTORE_B64: ${{ secrets.VANNAM_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "VANNAM_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build Play bundle
        env:
          VANNAM_KEYSTORE_PASSWORD: ${{ secrets.VANNAM_KEYSTORE_PASSWORD }}
          VANNAM_KEY_ALIAS: ${{ secrets.VANNAM_KEY_ALIAS }}
          VANNAM_KEY_PASSWORD: ${{ secrets.VANNAM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vannam-play-bundle
          path: app/build/outputs/bundle/release/*.aab
      # Manual runs also publish the bundle as a release, so it can be signed outside CI without GitHub secrets.
      - name: Publish bundle for signing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "bundle-${{ github.run_id }}" app/build/outputs/bundle/release/app-release.aab \
            --target "${{ github.sha }}" --prerelease --title "Bundle ${{ github.run_id }}" --notes "Unsigned release bundle"
      # One installable APK (face model included) for Galaxy Store, Xiaomi GetApps and Indus Appstore.
      - name: Build store APK
        if: env.VANNAM_KEYSTORE_FILE != ''
        env:
          VANNAM_KEYSTORE_PASSWORD: ${{ secrets.VANNAM_KEYSTORE_PASSWORD }}
          VANNAM_KEY_ALIAS: ${{ secrets.VANNAM_KEY_ALIAS }}
          VANNAM_KEY_PASSWORD: ${{ secrets.VANNAM_KEY_PASSWORD }}
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle=app/build/outputs/bundle/release/app-release.aab --output="$RUNNER_TEMP/u.apks" \
            --ks="$VANNAM_KEYSTORE_FILE" --ks-pass="pass:$VANNAM_KEYSTORE_PASSWORD" \
            --ks-key-alias="$VANNAM_KEY_ALIAS" --key-pass="pass:$VANNAM_KEY_PASSWORD"
          mkdir -p store && unzip -o "$RUNNER_TEMP/u.apks" universal.apk -d store
          mv store/universal.apk store/vannam-release.apk
      - uses: actions/upload-artifact@v4
        if: env.VANNAM_KEYSTORE_FILE != ''
        with:
          name: vannam-store-apk
          path: store/vannam-release.apk
