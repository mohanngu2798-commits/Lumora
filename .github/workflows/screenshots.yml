name: Store screenshots
on:
  workflow_dispatch:
  push:
    paths: ['tools/screenshots/**', '.github/workflows/screenshots.yml']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/screenshots/take.sh app/build/outputs/apk/debug/app-debug.apk shots
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: shots
      - name: Publish for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "shots-${{ github.run_id }}" shots/*.png --target "${{ github.sha }}" --prerelease --title "Screenshots ${{ github.run_id }}" --notes "Store screenshots"
